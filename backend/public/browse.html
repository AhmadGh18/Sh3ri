    // ---------- Search ----------
    async function viewSearch(q, type = 'all') {
      setView(el('div', { class: 'loading' }, el('span', { class: 'dots' }, 'جاري البحث')));
      let data;
      try { data = (await api('/search?q=' + encodeURIComponent(q) + '&type=' + type)).data; }
      catch (e) { return setView(el('div', { class: 'error-box' }, 'خطأ: ' + e.message)); }

      const sections = [];
      if (data.poems.length) {
        sections.push(el('div', { class: 'section-title' },
          el('span', { class: 'ornament' }, '﴿'),
          el('span', {}, 'القصائد'),
          el('span', { class: 'section-hint' }, data.poems.length + ' نتيجة'),
        ));
        sections.push(el('div', { class: 'grid poems' }, ...data.poems.map(p => el('div', {
          class: 'card poem',
          onclick: () => { location.hash = '#/poem/' + p.slug; },
        },
          el('div', { class: 'title' }, p.title_ar),
          el('div', { class: 'sub' }, p.poet ? p.poet.name_ar : ''),
          el('div', { class: 'meta' }, ...chips(p)),
        ))));
      }
      if (data.poets.length) {
        sections.push(el('div', { class: 'section-title' },
          el('span', { class: 'ornament' }, '◆'),
          el('span', {}, 'الشعراء'),
          el('span', { class: 'section-hint' }, data.poets.length + ' نتيجة'),
        ));
        sections.push(el('div', { class: 'grid poets' }, ...data.poets.map(p => el('div', {
          class: 'card',
          onclick: () => { location.hash = '#/poet/' + p.slug; },
        },
          el('div', { class: 'title' }, p.name_ar),
          el('div', { class: 'sub' }, ...chips(p)),
        ))));
      }
      if (data.verses.length) {
        sections.push(el('div', { class: 'section-title' },
          el('span', { class: 'ornament' }, '❦'),
          el('span', {}, 'الأبيات'),
          el('span', { class: 'section-hint' }, data.verses.length + ' نتيجة'),
        ));
        sections.push(el('div', { class: 'stack' }, ...data.verses.map(v => el('div', {
          class: 'verse-row',
          onclick: () => openVerseReader(v.uuid),
          style: 'background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; margin-bottom: 8px;',
        },
          el('span', { class: 'hemi a' }, v.hemistich_a),
          v.hemistich_b ? el('span', { class: 'sep' }, '◆') : null,
          v.hemistich_b ? el('span', { class: 'hemi b' }, v.hemistich_b) : null,
        ))));
      }
      if (!sections.length) sections.push(el('div', { class: 'empty' }, 'لا نتائج «' + q + '».'));

      setView(
        breadcrumb({ href: '#/', label: 'الرئيسية' }, 'بحث: «' + q + '»'),
        ...sections,
      );
    }

    // ---------- /me/… views (require auth) ----------
    async function viewMe(section) {
      if (!session.isSignedIn()) {
        setView(
          el('div', { class: 'empty' },
            el('div', { style: 'margin-bottom:12px' }, 'يجب تسجيل الدخول للوصول إلى هذه الصفحة.'),
            el('button', { class: 'auth-btn primary', onclick: () => openAuthModal('login') }, 'دخول'),
          )
        );
        return;
      }

      const titles = {
        'favorites':   { crumb: 'المفضلة',    title: '❤ المفضلة',    path: '/me/favorites',   emptyMsg: 'لم تُضِف أيّ مفضّلة بعد.', hint: 'اضغط على أيّ بيت أو قصيدة لتضاف هنا.' },
        'user-poems':  { crumb: 'قصائدي',     title: '✎ قصائدي',     path: '/user-poems',     emptyMsg: 'لم تكتب قصيدة بعد.',       hint: 'أنشئ قصيدة عبر POST /api/v1/user-poems (سنضيف واجهة كتابة قريبًا).' },
        'submissions': { crumb: 'مقترحاتي',   title: '📝 مقترحاتي',  path: '/submissions',    emptyMsg: 'لم تقدّم مقترحًا بعد.',    hint: 'يمكنك اقتراح قصائد أو تصحيحات عبر POST /api/v1/submissions.' },
      };
      const t = titles[section];
      setView(el('div', { class: 'loading' }, el('span', { class: 'dots' }, 'جاري التحميل')));

      let data;
      try { data = await api(t.path); }
      catch (e) { return setView(el('div', { class: 'error-box' }, 'خطأ: ' + e.message)); }

      const items = Array.isArray(data?.data) ? data.data : [];
      const cards = items.map(item => {
        if (section === 'favorites') {
          const p = item.poem || item.verse?.poem;
          const label = item.poem?.title_ar
            || (item.verse ? item.verse.hemistich_a + (item.verse.hemistich_b ? ' … ' + item.verse.hemistich_b : '') : '—');
          return el('div', {
            class: 'card poem',
            onclick: () => { if (p?.slug) location.hash = '#/poem/' + p.slug; },
          },
            el('div', { class: 'title' }, label),
            el('div', { class: 'sub' }, p?.poet?.name_ar || ''),
            el('div', { class: 'meta' }, el('span', { class: 'chip' }, item.type === 'verse' ? 'بيت' : 'قصيدة')),
          );
        }
        if (section === 'user-poems') {
          return el('div', {
            class: 'card',
            onclick: () => { /* No detail SPA view yet — open API JSON in new tab. */
              window.open('/api/v1/user-poems/' + item.uuid, '_blank');
            },
          },
            el('div', { class: 'title' }, item.title_ar),
            el('div', { class: 'meta' },
              el('span', { class: 'chip' }, item.status),
              el('span', { class: 'chip' }, item.visibility),
            ),
          );
        }
        // submissions
        return el('div', { class: 'card' },
          el('div', { class: 'title' }, item.payload?.title_ar || item.payload?.name_ar || '(بلا عنوان)'),
          el('div', { class: 'meta' },
            el('span', { class: 'chip' }, item.type),
            el('span', { class: 'chip' }, item.status),
          ),
        );
      });

      setView(
        breadcrumb({ href: '#/', label: 'الرئيسية' }, t.crumb),
        el('div', { class: 'section-title' },
          el('span', { class: 'ornament' }, '❦'),
          el('span', {}, t.title),
        ),
        cards.length
          ? el('div', { class: 'grid poems' }, ...cards)
          : el('div', { class: 'empty' },
              el('div', { style: 'margin-bottom:8px' }, t.emptyMsg),
              el('div', { style: 'color:var(--text-dim);font-size:12px' }, t.hint),
            ),
      );
    }

    // ---------- Router ----------
    function markActiveNav(routePath) {
      document.querySelectorAll('#main-nav a').forEach(a => {
        const r = a.getAttribute('data-route');
        a.classList.toggle('active',
          r === routePath ||
          (r !== '/' && routePath.startsWith(r))
        );
      });
    }
    function route() {
      const hash = location.hash || '#/';
      const [path, qs = ''] = hash.slice(1).split('?');
      const params = new URLSearchParams(qs);
      markActiveNav(path === '' ? '/' : path);
      // Stop any full-poem playback when navigating away from the poem view
      // (the ?v= modal is fine — it lives on top of the same poem page).
      if (!path.startsWith('/poem/')) poemPlayer.stop();

      if (path === '/' || path === '') return viewHome();
      if (path === '/poems')     return viewPoems(params.get('cursor'), { era: params.get('era') });
      if (path === '/poets')     return viewPoets(params.get('cursor'), { country: params.get('country') });
      if (path.startsWith('/poet/')) return viewPoet(path.slice(6));
      if (path.startsWith('/poem/')) return viewPoem(path.slice(6), params.get('v'));
      if (path.startsWith('/verse/')) return openVerseReader(path.slice(7));
      if (path === '/eras')      return viewEras();
      if (path === '/countries') return viewCountries();
      if (path === '/search')    return viewSearch(params.get('q') || '', params.get('type') || 'all');
      if (path === '/me/favorites')   return viewMe('favorites');
      if (path === '/me/user-poems')  return viewMe('user-poems');
      if (path === '/me/submissions') return viewMe('submissions');
      setView(el('div', { class: 'empty' }, '404 — لم يُعثر على الصفحة.'));
    }

    // ---------- Search box wiring ----------
    const searchInput = document.getElementById('search-q');
    const searchType  = document.getElementById('search-type');
    const runSearch = () => {
      const q = searchInput.value.trim();
      if (!q) return;
      location.hash = '#/search?q=' + encodeURIComponent(q) + '&type=' + searchType.value;
    };
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    document.getElementById('search-btn').addEventListener('click', runSearch);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); searchInput.focus(); searchInput.select();
      }
    });

    // ---------- Runtime config (google client id, feature flags) ----------
    // Populated once on first modal open; cached in-memory.
    let runtimeConfig = null;
    async function loadRuntimeConfig() {
      if (runtimeConfig) return runtimeConfig;
      try { runtimeConfig = (await api('/config')).data; }
      catch { runtimeConfig = { google_client_id: '', features: { google_signin: false } }; }
      return runtimeConfig;
    }

    // Google Identity Services — load the library once, on demand.
    let gsiReady = null;
    function ensureGsi() {
      if (gsiReady) return gsiReady;
      gsiReady = new Promise((resolve, reject) => {
        if (window.google?.accounts?.id) return resolve();
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true; s.defer = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Failed to load Google Identity Services'));
        document.head.appendChild(s);
      });
      return gsiReady;
    }

    /**
     * Exchange a Google credential (ID token) for a Sanctum session.
     * Reused by the "Continue with Google" button in both tabs.
     */
    async function signInWithGoogleCredential(credential, onError) {
      try {
        const res = await api('/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_token: credential,
            device_name: 'browse.html-' + (navigator.userAgent.split(' ').pop() || 'web'),
          }),
        });
        session.save(res.data.token, res.data.user);
        renderAuthSlot();
        closeAuthModal();
      } catch (e) {
        onError?.(e.message || 'تعذّر الدخول عبر جوجل.');
      }
    }

    // ---------- Auth header slot + sign-in / sign-up modal ----------
    const authSlot = document.getElementById('auth-slot');

    function initials(name) {
      if (!name) return '؟';
      const parts = name.trim().split(/\s+/).slice(0, 2);
      return parts.map(p => Array.from(p)[0] || '').join('') || name[0];
    }

    function renderAuthSlot() {
      authSlot.innerHTML = '';
      if (!session.isSignedIn()) {
        authSlot.appendChild(el('button', {
          class: 'auth-btn primary',
          onclick: () => openAuthModal('login'),
        }, 'دخول'));
        return;
      }

      const menu = el('div', { class: 'user-menu' });
      const avatar = el('button', {
        class: 'avatar',
        title: session.user?.name || '',
        onclick: (e) => { e.stopPropagation(); menu.classList.toggle('open'); },
      }, initials(session.user?.name));

      const dropdown = el('div', { class: 'dropdown' },
        el('div', { class: 'who' },
          el('div', { class: 'name' }, session.user?.name || '—'),
          el('div', { class: 'email' }, session.user?.email || ''),
        ),
        el('a', { href: '#/me/favorites', onclick: () => menu.classList.remove('open') }, '❤ المفضلة'),
        el('a', { href: '#/me/user-poems', onclick: () => menu.classList.remove('open') }, '✎ قصائدي'),
        el('a', { href: '#/me/submissions', onclick: () => menu.classList.remove('open') }, '📝 مقترحاتي'),
        el('div', { class: 'sep' }),
        el('button', {
          class: 'signout',
          onclick: async () => {
            menu.classList.remove('open');
            try { await api('/auth/logout', { method: 'POST' }); } catch {}
            session.clear();
            renderAuthSlot();
            location.hash = '#/';
          },
        }, '↩ تسجيل الخروج'),
      );
      menu.appendChild(avatar);
      menu.appendChild(dropdown);
      authSlot.appendChild(menu);

      // Close dropdown on outside click.
      document.addEventListener('click', () => menu.classList.remove('open'), { once: true });
    }

    function closeAuthModal() {
      const b = document.querySelector('.reader-backdrop[data-auth]');
      if (b) b.remove();
      const fallback = document.getElementById('google-fallback-host');
      if (fallback) fallback.remove();
    }

    /**
     * Fallback path when One Tap can't display (Safari, strict cookie envs).
     * We render a real GIS button off-screen and click it programmatically so
     * the user gets the standard Google popup instead of nothing.
     */
    async function openGoogleFallback(clientId, showErr) {
      try {
        await ensureGsi();
        const host = document.createElement('div');
        host.id = 'google-fallback-host';
        host.style.cssText = 'position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(-50%);z-index:200;background:var(--bg-elev);padding:12px;border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-md)';
        document.body.appendChild(host);

        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: async (r) => {
            host.remove();
            if (!r?.credential) { showErr('لم يُرجع جوجل رمز الاعتماد.'); return; }
            await signInWithGoogleCredential(r.credential, showErr);
          },
          ux_mode: 'popup',
        });
        window.google.accounts.id.renderButton(host, {
          type: 'standard', theme: 'outline', size: 'large',
          text: 'signin_with', shape: 'pill', locale: 'ar',
        });
      } catch (e) {
        showErr(e.message || 'تعذّر تحميل تسجيل الدخول بجوجل.');
      }
    }

    async function openAuthModal(initialTab = 'login') {
      closeAuthModal();

      const errBox = el('div', { class: 'err', style: 'display:none' });
      const showErr = (msg) => { errBox.textContent = msg; errBox.style.display = ''; };

      const cfg = await loadRuntimeConfig();

      // --- Google button (only if server has a client_id configured) ---
      const googleBtn = el('button', {
        type: 'button', class: 'g-btn',
        title: cfg.features.google_signin ? 'الدخول باستخدام حساب جوجل' : 'ميزة الدخول عبر جوجل غير مفعّلة على الخادم',
        disabled: !cfg.features.google_signin,
        onclick: async () => {
          try {
            await ensureGsi();
            window.google.accounts.id.initialize({
              client_id: cfg.google_client_id,
              callback: async (r) => {
                if (!r?.credential) { showErr('لم يُرجع جوجل رمز الاعتماد.'); return; }
                await signInWithGoogleCredential(r.credential, showErr);
              },
              ux_mode: 'popup',
              use_fedcm_for_prompt: true,
            });
            window.google.accounts.id.prompt((notification) => {
              // Some browsers block the One Tap prompt (Safari private mode,
              // strict cookie settings). Fall back to a full-fat popup by
              // rendering a temporary GSI button and clicking it.
              if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                openGoogleFallback(cfg.google_client_id, showErr);
              }
            });
          } catch (e) {
            showErr(e.message || 'تعذّر تحميل تسجيل الدخول بجوجل.');
          }
        },
      },
        // Inline Google G logo — no external image, no CDN dependency.
        el('svg', { viewBox: '0 0 48 48', 'aria-hidden': 'true' }),
        el('span', {}, 'المتابعة باستخدام Google'),
      );
      // Inject the multi-color G paths (createElementNS needed for SVG).
      const svg = googleBtn.querySelector('svg');
      const ns = 'http://www.w3.org/2000/svg';
      [
        ['M43.6 20.5H42V20.4H24v7.2h11.1c-1.5 4-5.3 7-9.1 7-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1.1 7.4 2.8l5.2-5.2C34.8 6.6 29.7 5 24 5 13.5 5 5 13.5 5 24s8.5 19 19 19c11 0 18.4-8 18.4-19 0-1.2-.1-2.4-.4-3.5z', '#FFC107'],
        ['M6.3 14.7l6 4.4C13.9 15.3 18.6 12.5 24 12.5c2.8 0 5.4 1.1 7.4 2.8l5.2-5.2C34.8 6.6 29.7 5 24 5 16.3 5 9.7 9.4 6.3 14.7z', '#FF3D00'],
        ['M24 43c5.6 0 10.6-2.1 14.4-5.6l-6.7-5.7c-2 1.5-4.6 2.5-7.7 2.5-3.8 0-7.6-3-9.1-7l-6 4.6C7.9 38.4 15.4 43 24 43z', '#4CAF50'],
        ['M43.6 20.5H42V20.4H24v7.2h11.1c-.7 2-2 3.7-3.7 4.9l6.7 5.7C42.4 34.6 44 29.5 44 24c0-1.2-.1-2.4-.4-3.5z', '#1976D2'],
      ].forEach(([d, fill]) => {
        const p = document.createElementNS(ns, 'path');
        p.setAttribute('d', d); p.setAttribute('fill', fill);
        svg.appendChild(p);
      });

      const sso = el('div', { class: 'auth-sso' },
        googleBtn,
        !cfg.features.google_signin
          ? el('div', { class: 'g-hint' }, 'مطلوب GOOGLE_CLIENT_ID على الخادم لتفعيل هذا الخيار.')
          : null,
      );
      const divider = el('div', { class: 'auth-divider' }, el('span', {}, 'أو'));

      // --- login form ---
      const loginForm = el('form', { class: 'auth-form', autocomplete: 'on',
        onsubmit: async (e) => {
          e.preventDefault();
          errBox.style.display = 'none';
          const fd = new FormData(loginForm);
          const submitBtn = loginForm.querySelector('button[type=submit]');
          submitBtn.disabled = true; submitBtn.textContent = '…جاري الدخول';
          try {
            const res = await api('/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: fd.get('email'),
                password: fd.get('password'),
                device_name: 'browse.html-' + (navigator.userAgent.split(' ').pop() || 'web'),
              }),
            });
            session.save(res.data.token, res.data.user);
            renderAuthSlot();
            closeAuthModal();
          } catch (err) {
            showErr(err.message || 'تعذّر تسجيل الدخول.');
            submitBtn.disabled = false; submitBtn.textContent = 'دخول';
          }
        },
      },
        el('div', {},
          el('label', {}, 'البريد الإلكتروني'),
          el('input', { type: 'email', name: 'email', required: true, autocomplete: 'email' }),
        ),
        el('div', {},
          el('label', {}, 'كلمة المرور'),
          el('input', { type: 'password', name: 'password', required: true, autocomplete: 'current-password' }),
        ),
        el('button', { type: 'submit' }, 'دخول'),
      );

      // --- login form ---
      const loginForm = el('form', { class: 'auth-form', autocomplete: 'on',
        onsubmit: async (e) => {
          e.preventDefault();
          errBox.style.display = 'none';
          const fd = new FormData(loginForm);
          const submitBtn = loginForm.querySelector('button[type=submit]');
          submitBtn.disabled = true; submitBtn.textContent = '…جاري الدخول';
          try {
            const res = await api('/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: fd.get('email'),
                password: fd.get('password'),
                device_name: 'browse.html-' + (navigator.userAgent.split(' ').pop() || 'web'),
              }),
            });
            session.save(res.data.token, res.data.user);
            renderAuthSlot();
            closeAuthModal();
          } catch (err) {
            showErr(err.message || 'تعذّر تسجيل الدخول.');
            submitBtn.disabled = false; submitBtn.textContent = 'دخول';
          }
        },
      },
        el('div', {},
          el('label', {}, 'البريد الإلكتروني'),
          el('input', { type: 'email', name: 'email', required: true, autocomplete: 'email' }),
        ),
        el('div', {},
          el('label', {}, 'كلمة المرور'),
          el('input', { type: 'password', name: 'password', required: true, autocomplete: 'current-password' }),
        ),
        el('button', { type: 'submit' }, 'دخول'),
      );

      // --- register form ---
      const regForm = el('form', { class: 'auth-form', autocomplete: 'on',
        onsubmit: async (e) => {
          e.preventDefault();
          errBox.style.display = 'none';
          const fd = new FormData(regForm);
          const pw = fd.get('password');
          if (pw !== fd.get('password_confirmation')) {
            showErr('كلمتا المرور غير متطابقتين.'); return;
          }
          const submitBtn = regForm.querySelector('button[type=submit]');
          submitBtn.disabled = true; submitBtn.textContent = '…جاري إنشاء الحساب';
          try {
            const res = await api('/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: fd.get('name'),
                email: fd.get('email'),
                password: pw,
                password_confirmation: fd.get('password_confirmation'),
                device_name: 'browse.html-' + (navigator.userAgent.split(' ').pop() || 'web'),
              }),
            });
            session.save(res.data.token, res.data.user);
            renderAuthSlot();
            closeAuthModal();
          } catch (err) {
            showErr(err.message || 'تعذّر إنشاء الحساب.');
            submitBtn.disabled = false; submitBtn.textContent = 'إنشاء الحساب';
          }
        },
      },
        el('div', {},
          el('label', {}, 'الاسم'),
          el('input', { type: 'text', name: 'name', required: true, autocomplete: 'name' }),
        ),
        el('div', {},
          el('label', {}, 'البريد الإلكتروني'),
          el('input', { type: 'email', name: 'email', required: true, autocomplete: 'email' }),
        ),
        el('div', {},
          el('label', {}, 'كلمة المرور'),
          el('input', { type: 'password', name: 'password', required: true, autocomplete: 'new-password', minlength: 9 }),
          el('div', { class: 'hint' }, '٩ أحرف على الأقل، مع حرف ورقم ورمز.'),
        ),
        el('div', {},
          el('label', {}, 'تأكيد كلمة المرور'),
          el('input', { type: 'password', name: 'password_confirmation', required: true, autocomplete: 'new-password', minlength: 9 }),
        ),
        el('button', { type: 'submit' }, 'إنشاء الحساب'),
      );

      const body = el('div', {}, loginForm);

      const tabLogin = el('button', { type: 'button' }, 'تسجيل الدخول');
      const tabReg   = el('button', { type: 'button' }, 'إنشاء حساب');
      const showTab = (which) => {
        tabLogin.classList.toggle('active', which === 'login');
        tabReg.classList.toggle('active', which === 'register');
        body.replaceChildren(which === 'login' ? loginForm : regForm);
        errBox.style.display = 'none';
      };
      tabLogin.onclick = () => showTab('login');
      tabReg.onclick   = () => showTab('register');
      showTab(initialTab);

      const modal = el('div', { class: 'auth-modal', onclick: (e) => e.stopPropagation() },
        el('button', { class: 'close', title: 'إغلاق', onclick: closeAuthModal }, '×'),
        el('h2', {}, initialTab === 'register' ? 'مرحبًا بك في شِعْري' : 'أهلًا بعودتك'),
        el('div', { class: 'lead' }, 'ادخل لحفظ المفضلة، إضافة قصائدك، والمشاركة في التحسين.'),
        sso,
        divider,
        el('div', { class: 'auth-tabs' }, tabLogin, tabReg),
        errBox,
        body,
      );

      const backdrop = el('div', {
        class: 'reader-backdrop',
        'data-auth': 'true',
        onclick: closeAuthModal,
      }, modal);
      document.body.appendChild(backdrop);
    }

    renderAuthSlot();

    // ---------- Theme toggle ----------
    const themeBtn = document.getElementById('theme-toggle');
    const applyTheme = (theme) => {
      if (theme === 'auto' || !theme) {
        document.documentElement.removeAttribute('data-theme');
        themeBtn.textContent = '◐';
        themeBtn.title = 'المظهر: تلقائي';
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        themeBtn.textContent = theme === 'dark' ? '☾' : '☀';
        themeBtn.title = theme === 'dark' ? 'المظهر: داكن' : 'المظهر: فاتح';
      }
    };
    try { applyTheme(localStorage.getItem('sh3ri.theme') || 'auto'); } catch { applyTheme('auto'); }
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'auto';
      const next = current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto';
      try { localStorage.setItem('sh3ri.theme', next); } catch {}
      applyTheme(next);
    });

    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
